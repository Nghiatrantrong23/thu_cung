# Local development only: separate named volume; no mount of existing PostgreSQL data.
name: petcare-local
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: ${PETCARE_DB_PASSWORD:?Set PETCARE_DB_PASSWORD privately}
      POSTGRES_DB: petcare_dev
    volumes:
      - petcare_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U petcare -d petcare_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    # Share DB networking so the guarded migration CLI still connects via loopback.
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: petcare
      DB_PASSWORD: ${PETCARE_DB_PASSWORD:?Set PETCARE_DB_PASSWORD privately}
      DB_NAME: petcare_dev
      PETCARE_ALLOW_DB_WRITE: petcare_dev
    command: [npm, run, "db:init"]
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: petcare
      DB_PASSWORD: ${PETCARE_DB_PASSWORD:?Set PETCARE_DB_PASSWORD privately}
      DB_NAME: petcare_dev
      JWT_SECRET: ${PETCARE_JWT_SECRET:?Set PETCARE_JWT_SECRET privately}
      JWT_REFRESH_SECRET: ${PETCARE_JWT_REFRESH_SECRET:?Set PETCARE_JWT_REFRESH_SECRET privately}
      CORS_ORIGIN: http://localhost:8080
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: .
      dockerfile: dichvu/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
volumes:
  petcare_data:
